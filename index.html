<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Анкета для друзей</title>
  <meta name="theme-color" content="#2f6fd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Анкета">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png?v=2">
  <meta name="description" content="Анкета для друзей Ильи: заполни и отправь. Ответы увидит только Илья.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Анкета для друзей">
  <meta property="og:description" content="Ответы увидит только Илья">
  <meta property="og:image" content="https://anketa-ilyass.github.io/anketa/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preload" href="fonts/golos.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <svg class="rainbow-arc" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax meet">
      <g fill="none" stroke-width="16" stroke-linecap="butt">
        <path d="M24 220 A176 176 0 0 1 376 220" stroke="#ff8fab"/>
        <path d="M40 220 A160 160 0 0 1 360 220" stroke="#ffbf80"/>
        <path d="M56 220 A144 144 0 0 1 344 220" stroke="#ffe680"/>
        <path d="M72 220 A128 128 0 0 1 328 220" stroke="#9ee6a8"/>
        <path d="M88 220 A112 112 0 0 1 312 220" stroke="#8fc8ff"/>
        <path d="M104 220 A96 96 0 0 1 296 220" stroke="#c4a3ff"/>
      </g>
      <g fill="none" stroke="#2b1d4a" stroke-width="3">
        <path d="M16 220 A184 184 0 0 1 384 220"/><path d="M112 220 A88 88 0 0 1 288 220"/>
      </g>
      <g fill="#fff" stroke="#2b1d4a" stroke-width="3">
        <path d="M6 220 q0-26 26-26 q6-16 24-14 q14-12 30 2 q20 0 20 22 q16 4 14 16z"/>
        <path d="M394 220 q0-26-26-26 q-6-16-24-14 q-14-12-30 2 q-20 0-20 22 q-16 4-14 16z"/>
      </g>
    </svg>
    <svg class="smiley" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="35" cy="40" r="5" fill="currentColor"/><circle cx="65" cy="40" r="5" fill="currentColor"/><path d="M28 60 Q50 82 72 60" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
  </div>
  <main id="app"><div class="loading"><div class="spinner">✦</div><div>Загрузка…</div></div></main>
  <footer class="taskbar">
    <button class="start" id="startBtn">✦ пуск</button>
    <div class="tasks" id="tasks"></div>
    <div class="tray"><span id="trayNew"></span><b id="clock"></b></div>
  </footer>
  <div class="startmenu" id="startMenu" hidden></div>
  <noscript><p style="padding:24px;text-align:center;font:16px sans-serif;background:#fff">Чтобы открыть анкету, включи JavaScript в браузере.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
